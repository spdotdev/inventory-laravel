name: Security audit

# Supersede an in-flight run when a newer commit lands on the same ref, so
# rapid pushes/PR updates don't stack redundant (and, for the emulator/MySQL
# jobs, expensive) runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Scans dependencies for known CVEs and enforces composer lockfile sync.
# Runs on dependency-manifest changes + a daily schedule to catch newly
# disclosed advisories in unchanged deps. Mirrors leadai's audit.yml.

on:
  push:
    branches: [ main ]
    paths:
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - 'composer.json'
      - 'composer.lock'
  schedule:
    # 04:30 UTC daily — catches new CVEs without a manifest change.
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer-audit:
    name: composer audit
    runs-on: ubuntu-latest
    # Guard: skip cleanly until the package manifest exists (planning-only repo).
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Skip if no composer.json yet
        id: guard
        run: |
          if [ -f composer.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      # --strict turns a lockfile-drift warning into a non-zero exit;
      # --no-check-publish skips publish-only metadata rules.
      - name: Verify composer.lock is in sync
        if: steps.guard.outputs.present == 'true'
        run: composer validate --strict --no-check-publish

      # --locked audits the lock directly (no install needed);
      # --abandoned=ignore avoids failing on long-deprecated packages. This is the
      # BLOCKING dependency-CVE gate for the package (X6). The GitHub-native
      # dependency-review-action was removed rather than kept fail-open: it needs
      # Dependency Graph / Advanced Security (unavailable here, so it hard-errored
      # and would red every composer.* PR on infra), and composer audit already
      # covers CVE detection — a fail-open gate is worse than no duplicate gate.
      - name: composer audit
        if: steps.guard.outputs.present == 'true'
        run: composer audit --no-interaction --abandoned=ignore --locked

  # A scheduled workflow that fails sends no notification anywhere by default,
  # so a new CVE surfacing on the daily run could stay red unnoticed (the
  # android repo's nightly stayed red for a month exactly this way, 2026-07-24
  # → 2026-08-28). Failure opens (or bumps) a labeled tracking issue; the next
  # green scheduled run closes it. Push/PR failures are already visible on the
  # PR, so this only fires for schedule/manual runs.
  report:
    runs-on: ubuntu-latest
    needs: composer-audit
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      AUDIT_RESULT: ${{ needs.composer-audit.result }}
    steps:
      - name: Open, bump, or close the scheduled-failure issue
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label scheduled-failure --state open --json number --jq '.[0].number // empty')
          if [ "$AUDIT_RESULT" = "failure" ]; then
            if [ -z "$existing" ]; then
              gh label create scheduled-failure --repo "$GITHUB_REPOSITORY" --color B60205 --description "Scheduled security audit is red" --force
              {
                echo "The scheduled security-audit run failed: $RUN_URL"
                echo ""
                echo "Likely a newly disclosed CVE in a locked dependency (no code change needed to break). This issue is the alarm; the next green scheduled run closes it automatically."
              } > /tmp/issue-body.md
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "Scheduled security audit is failing" \
                --label scheduled-failure \
                --body-file /tmp/issue-body.md
            else
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Still failing: $RUN_URL"
            fi
          elif [ "$AUDIT_RESULT" = "success" ] && [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment "Green again: $RUN_URL"
          fi
